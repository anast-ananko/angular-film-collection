<div class="card" [routerLink]="['/film', film().id]">
  <img [src]="film().posterUrl" alt="Poster"/>

  <h3>{{ film().title }}</h3>
  <p>{{ film().year }} • {{ film().genre }}</p>
  <p>⭐ {{ film().rating }}</p>

  <button class="favorite-btn" (click)="onToggleFavorite($event)">
    <span class="icon">
      {{ film().isFavorite ? '⭐' : '☆' }}
    </span>

    {{ film().isFavorite ? 'Remove' : 'Add' }} favorite
  </button>
</div>
